name: Backend contracts

on:
  push:
    branches: [main]
    paths: ['backend/**', 'scripts/verify-torrent-source.py', '.github/actions/linux-build-deps/**', '.github/workflows/backend-contracts.yml', '.github/workflows/release.yml']
  pull_request:
    paths: ['backend/**', 'scripts/verify-torrent-source.py', '.github/actions/linux-build-deps/**', '.github/workflows/backend-contracts.yml', '.github/workflows/release.yml']
  workflow_call:
    inputs:
      ref:
        description: 'Exact release tag or revision to validate'
        required: true
        type: string

permissions:
  contents: read

jobs:
  contracts:
    name: Backend ${{ matrix.runtime }} contracts
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: native
            cgo: '1'
            file_io: mmap
          - runtime: production
            cgo: '0'
            file_io: classic
    env:
      CGO_ENABLED: ${{ matrix.cgo }}
      TORRENT_STORAGE_DEFAULT_FILE_IO: ${{ matrix.file_io }}
      ANIDOG_OCR_FIXTURE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install media inspection tools
        timeout-minutes: 15
        uses: leeyang1990/anidog/.github/actions/linux-build-deps@ec5f838a9e9a8695b6213a0af58a3b7893f4ec2c
        with:
          package-set: media
      - name: Verify dependency source provenance
        run: python3 scripts/verify-torrent-source.py
      - name: Verify model installation failure and idempotence contracts
        run: python3 backend/tools/test_install_ocr_models.py
      - name: Architecture and backend contracts
        working-directory: backend
        run: |
          go test -p 2 -count=1 ./internal/... ./cmd/anidog
          go vet ./internal/... ./cmd/anidog
      - name: Build production backend
        if: matrix.runtime == 'production'
        working-directory: backend
        run: go build ./cmd/anidog
      - name: Concurrency and recovery contracts
        if: matrix.runtime == 'native'
        working-directory: backend
        run: go test -p 2 -race -count=1 ./internal/downloader/... ./internal/service/download ./internal/service/mediacheck ./internal/service/orchestrator ./internal/service/stream
      - name: Browser recovery fixtures
        if: matrix.runtime == 'native'
        working-directory: backend
        run: ROD_BROWSER_BIN="$(command -v google-chrome)" ANIDOG_BROWSER_FIXTURE=1 go test ./internal/service/stream -run '^TestBrowserRecoveryFixtures$' -count=1

  postgres:
    name: PostgreSQL provenance contracts
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fixture"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      CGO_ENABLED: '0'
      TORRENT_STORAGE_DEFAULT_FILE_IO: classic
      ANIDOG_POSTGRES_CONTRACT: '1'
      DATABASE_URL: postgres://fixture:fixture@127.0.0.1:5432/fixture?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Real database retention and concurrent reference contracts
        working-directory: backend
        run: go test ./internal/service/scheduler -run '^TestPostgresEvidenceRetention$' -count=1 -timeout=90s
