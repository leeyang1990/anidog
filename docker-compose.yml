# AniDog 生产部署 —— 全部服务走 Docker Hub 镜像，开箱即用。
#
# 使用：
#   1. cp .env.example .env  并填好密码/密钥
#   2. docker compose up -d
#   3. 浏览器访问 http://<host>:3002
#
# 镜像由 GitHub Actions 在 push tag 时自动构建发布（amd64 + arm64）。
# 本地开发请改用 docker-compose.dev.yml（源码挂载 + 热重载，不走镜像）。

# 后端内置 BT 引擎直接写入这个目录；宿主机只配置一次下载路径。
x-download-mount: &download-mount
  type: bind
  source: ${DOWNLOAD_ROOT:-./downloads}
  target: /downloads

services:
  postgres:
    image: postgres:16-alpine
    container_name: anidog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-anidog}
      POSTGRES_USER: ${POSTGRES_USER:-anidog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-anidog}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - anidog-network

  backend:
    image: leeyang1990/anidog-backend:${TAG:-latest}
    container_name: anidog-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-anidog}:${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-anidog}?sslmode=disable

      DOWNLOADER_TYPE: embedded
      BT_LISTEN_PORT: ${BT_LISTEN_PORT:-6881}
      BT_STATE_DIR: /var/lib/anidog/torrent
      BT_SEED: "${BT_SEED:-true}"
      STREAM_MIN_DURATION_SECONDS: ${STREAM_MIN_DURATION_SECONDS:-100}

      SECRET_KEY: ${SECRET_KEY:?请在 .env 中设置 SECRET_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RSS_CHECK_INTERVAL: ${RSS_CHECK_INTERVAL:-30}

      ENABLE_NOTIFICATIONS: "${ENABLE_NOTIFICATIONS:-false}"
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      TMDB_LANGUAGE: ${TMDB_LANGUAGE:-zh-CN}
      TMDB_BASE_URL: ${TMDB_BASE_URL:-https://api.themoviedb.org/3}
    volumes:
      - *download-mount
      - torrent_state:/var/lib/anidog/torrent
    ports:
      - "${BT_LISTEN_PORT:-6881}:${BT_LISTEN_PORT:-6881}"
      - "${BT_LISTEN_PORT:-6881}:${BT_LISTEN_PORT:-6881}/udp"
    networks:
      - anidog-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8088/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    image: leeyang1990/anidog-frontend:${TAG:-latest}
    container_name: anidog-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3002}:80"   # nginx 反代 /api 与 /ws 到 backend:8088
    networks:
      - anidog-network

volumes:
  postgres_data:
    driver: local
  torrent_state:
    driver: local

networks:
  anidog-network:
    driver: bridge
